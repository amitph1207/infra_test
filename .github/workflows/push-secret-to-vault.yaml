# Push a secret from GitHub Actions into in-cluster Vault. The value never lives in repo/code.
#
# Setup (one-time):
# 1. In repo: Settings → Secrets and variables → Actions → New repository secret:
#    - HBN_PASSWORD = the actual password (or leave unset to skip write).
# 2. So the cluster is reachable from the runner: either add KUBE_CONFIG (base64 kubeconfig)
#    as a repo secret, or run this on a self-hosted runner that already has kubeconfig.
# 3. Trigger: manual (workflow_dispatch) or on push to main (optional).
#
# Flow: GitHub Secrets (encrypted) → this job → kubectl exec vault-0 → vault kv put.
# ESO then syncs Vault → K8s Secret; apps use it. Value is never in Git.

name: Push secret to Vault

on:
  workflow_dispatch:

jobs:
  push-to-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "KUBE_CONFIG not set. Add a repo secret with base64-encoded kubeconfig, or run this on a self-hosted runner with kubeconfig."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Write secret to Vault
        env:
          HBN_PASSWORD: ${{ secrets.HBN_PASSWORD }}
          NAMESPACE: default
        run: |
          if [[ -z "$HBN_PASSWORD" ]]; then
            echo "HBN_PASSWORD not set in repo secrets. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          kubectl exec vault-0 -n "$NAMESPACE" -- vault kv put secret/dpf/hbn-user-password password="$HBN_PASSWORD"
          echo "Secret updated in Vault. ESO will sync to K8s within refreshInterval."
