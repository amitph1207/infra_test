apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: busybox-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/amitph1207/Infra_test.git
    targetRevision: main
    path: charts/busybox-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: busybox-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
