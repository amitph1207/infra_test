# Repo credential for Argo CD. Create this in the same namespace as Argo CD (default).
# GitHub requires a Personal Access Token (PAT), not account password:
#   Settings → Developer settings → Personal access tokens → Generate.
# Apply once manually so Argo can clone the repo: kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: private-repo
  namespace: default
  labels:
    argocd.argoproj.io/secret-type: repository
