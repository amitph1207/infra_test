# Hello app: uses secret "hbn-user-password" synced by ESO from Vault.
# Flow: Vault (value only) -> ESO -> K8s Secret -> this pod (env). Nothing in Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - name: hello
        image: hashicorp/http-echo
        args:
        - "-text=hello from argocd"
        ports:
        - containerPort: 5678
        env:
        # Secret comes from Vault via ESO (never stored in Git)
        - name: HBN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hbn-user-password
              key: password
