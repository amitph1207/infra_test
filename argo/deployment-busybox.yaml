# Busybox pod using same secret as hello-app — for verifying secret injection (exec and run: env | grep HBN_PASSWORD).
# Same flow: Vault -> ESO -> K8s Secret hbn-user-password -> this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-secret-check
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-secret-check
  template:
    metadata:
      labels:
        app: busybox-secret-check
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command: ["sleep", "infinity"]
        env:
        - name: HBN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hbn-user-password
              key: password
